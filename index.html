<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Auto Klik Vast (Double Click After 7s)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div id="frame" style="width: 100%; margin: auto; position: relative; z-index: 99998;">
    <p id="status">Loading...</p>
  </div>

  <script>
    async function fetchAndClick() {
      const frame = document.getElementById("frame");
      const status = document.getElementById("status");

      try {
        // Pakai proxy server untuk fetch HTML itchytree
        const targetUrl = "https://itchytree.com/aCWDZ.yEP_2GQH9IMJT-cL2MMNzOU_1QMRTScT2-NVTWQXwYO_TaIbwcNdT-cf2gNhCiZ_pkcl2m1n1-bpHqRrpsd_GuFvnwPxT-Az1AMBWCN_hEZFjGkH2-NJDKJLlMM_DOFPiQORT-JTmUYVmWN_lYMZzagb5-OdTeEf0gM_jiEj3kOlT-En4oJpmq1_1sbtHuRvp-dxGyFznAY_mCFDuEbFm-VHyIPJXKR_yMdNWOUPm-cRnSJTpUZ_DW0XwYNZT-FbjcYdWeY_5gNhjiQjy-ZlTmAnxoY_jqkrysZtm-JvjwZxTyM_4AOBTCkDx-NFDGIHxIN_zKkLxMONC-ZP6QbR2S5_lUaVWWQX9-NZjacbwcO_DeUf5gMhQ-?iframeId=nfqqub";
        const res = await fetch(`/proxy?url=${encodeURIComponent(targetUrl)}`);
        const html = await res.text();

        // Buat element sementara untuk parsing
        const temp = document.createElement("div");
        temp.innerHTML = html;

        // Cari link onclick
        const link = temp.querySelector("a[onclick]");
        if (!link) {
          status.innerText = "Link tidak ditemukan!";
          return;
        }

        const onclick = link.getAttribute("onclick");
        const match = onclick.match(/window\.open\('([^']+)'/);
        const targetHref = match ? match[1] : null;

        if (!targetHref) {
          status.innerText = "Gagal ambil URL dari onclick!";
          return;
        }

        status.innerText = "Link ditemukan! Auto klik dalam 7 detik...";
        
        // Tampilkan iframe atau image placeholder
        frame.innerHTML = `<iframe src="${targetHref}" width="300" height="250" frameborder="0"></iframe>`;

        // Auto klik + redirect setelah 7 detik
        setTimeout(() => {
          window.location.href = targetHref;
        }, 3000);

      } catch (err) {
        status.innerText = "Error: " + err;
        console.error(err);
      }
    }

    window.onload = fetchAndClick;
  </script>

</body>
</html>
